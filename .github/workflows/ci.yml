name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: acs
          POSTGRES_PASSWORD: acs
          POSTGRES_DB: acs
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U acs"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10

    env:
      # The integration suite reads TEST_* and builds its own env; see
      # vitest.integration.config.ts.
      TEST_DATABASE_URL: postgres://acs:acs@localhost:5432/acs_test
      TEST_REDIS_URL: redis://localhost:6379/1
      ADMIN_DATABASE_URL: postgres://acs:acs@localhost:5432/postgres
      JWT_SECRET: ci-jwt-secret-that-is-long-enough-ok
      OTP_SECRET: ci-otp-secret-that-is-long-enough-ok

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm audit --audit-level high
